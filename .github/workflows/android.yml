name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Check scheduling and suggestions
        run: |
          mkdir -p build/core-checks
          javac -encoding UTF-8 -d build/core-checks app/src/main/java/ir/delneveshte/app/Settings.java app/src/main/java/ir/delneveshte/app/Message.java app/src/main/java/ir/delneveshte/app/SchedulePlanner.java app/src/main/java/ir/delneveshte/app/TextBank.java app/src/test/java/ir/delneveshte/app/CoreChecks.java
          java -cp build/core-checks ir.delneveshte.app.CoreChecks
      - uses: actions/upload-artifact@v4
        with:
          name: delneveshte-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
