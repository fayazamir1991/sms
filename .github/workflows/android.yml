name: Android build

on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/**', 'release-input/**', 'signing-certificate.sha256', '*.gradle', 'gradle.properties', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
      APP_RELEASE_UPLOAD_TOKEN: ${{ secrets.APP_RELEASE_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Show focused unit-test failures
        if: failure()
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for path in Path('app/build/test-results').rglob('TEST-*.xml'):
              for case in ET.parse(path).getroot().iter('testcase'):
                  for failure in case.findall('failure'):
                      print(case.get('classname'), case.get('name'), failure.get('message'))
                      print((failure.text or '')[:4000])
          PYTEST
      - name: Check scheduling and suggestions
        run: |
          mkdir -p build/core-checks
          javac -encoding UTF-8 -d build/core-checks app/src/main/java/ir/delneveshte/app/Settings.java app/src/main/java/ir/delneveshte/app/Message.java app/src/main/java/ir/delneveshte/app/SchedulePlanner.java app/src/main/java/ir/delneveshte/app/TextBank.java app/src/test/java/ir/delneveshte/app/CoreChecks.java
          java -cp build/core-checks ir.delneveshte.app.CoreChecks
      - name: Locate an already signed release candidate
        id: prepared
        if: github.event_name != 'pull_request'
        run: |
          candidate="release-input/delneveshte-$(python3 scripts/version.py).apk"
          if test -f "$candidate"; then echo "path=$candidate" >> "$GITHUB_OUTPUT"; fi
      - name: Restore the original signing key for compatible updates
        if: github.event_name != 'pull_request' && steps.prepared.outputs.path == '' && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_PASSWORD != ''
        run: python3 scripts/restore-signing.py
      - name: Build and verify the distributable APK
        id: distributable
        if: github.event_name != 'pull_request'
        env:
          PREPARED_APK: ${{ steps.prepared.outputs.path }}
        run: |
          if test -z "$PREPARED_APK" && { test -z "$ANDROID_KEYSTORE_BASE64" || test -z "$ANDROID_SIGNING_PASSWORD"; }; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if test -n "$PREPARED_APK"; then
            python3 scripts/verify-prepared-apk.py
            mkdir -p app/build/outputs/apk/release
            cp "$PREPARED_APK" app/build/outputs/apk/release/app-release.apk
          else
            gradle --no-daemon :app:assembleRelease :app:lintRelease
          fi
          python3 scripts/verify-apk-signing.py app/build/outputs/apk/release/app-release.apk
          echo 'available=true' >> "$GITHUB_OUTPUT"
      - name: Enable KVM for Android 14 startup verification
        if: github.event_name != 'pull_request' && steps.distributable.outputs.available == 'true'
        run: sudo chmod 666 /dev/kvm
      - name: Verify the signed APK opens with messages and switches categories offline on Android 14
        if: github.event_name != 'pull_request' && steps.distributable.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/check-offline-startup.py
      - name: Preserve actual APK interface previews
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          preview_dir="docs/previews/v$(python3 scripts/version.py)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$preview_dir"
          if ! git diff --cached --quiet; then
            git commit -m "Add Android interface previews for $(python3 scripts/version.py)"
            git push origin HEAD:main
          fi
      - name: Upload APK to the persistent application server
        id: server_upload
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.distributable.outputs.available == 'true' && env.APP_RELEASE_UPLOAD_TOKEN != ''
        run: |
          version="$(python3 scripts/version.py)"
          apk="app/build/outputs/apk/release/app-release.apk"
          checksum="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          server="${API_BASE_URL:-$(cat app/api-base-url.txt)}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            -X POST "$server/api/admin/app-releases" \
            -H "Authorization: Bearer $APP_RELEASE_UPLOAD_TOKEN" \
            -H "X-Release-Version: $version" -H "X-APK-SHA256: $checksum" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@$apk"
      - name: Report missing persistent-server upload credential
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.distributable.outputs.available == 'true' && env.APP_RELEASE_UPLOAD_TOKEN == ''
        run: echo '::warning::Set GitHub Actions secret APP_RELEASE_UPLOAD_TOKEN and matching APP_RELEASE_UPLOAD_TOKEN_SHA256 on the app server to publish update APKs to persistent storage.'
      - name: Report missing preserved signing key
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.distributable.outcome == 'success' && steps.distributable.outputs.available != 'true' && steps.prepared.outputs.path == ''
        run: echo '::warning::Tests passed, but distribution is held. Restore ANDROID_KEYSTORE_BASE64 and ANDROID_SIGNING_PASSWORD so future APKs can update the installed app with the same signature.'
      - name: Publish GitHub releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.distributable.outputs.available == 'true' && steps.server_upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-releases.sh
      - name: Explain why publication waits for server credentials
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.distributable.outputs.available == 'true' && steps.server_upload.outcome == 'failure'
        run: echo '::warning::The APK was not uploaded to persistent server storage, so no release tag was created. Check APP_RELEASE_UPLOAD_TOKEN in GitHub and its matching SHA-256 on the server, then rerun this workflow.'
