name: Server tests and Cloudflare deployment

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: server
      - run: npm run seed:build
        working-directory: server
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SERVER_RUNTIME_SECRETS: ${{ secrets.SERVER_RUNTIME_SECRETS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Add CLOUDFLARE_ACCOUNT_ID to repository Secrets. See docs/CLOUDFLARE.md'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Add CLOUDFLARE_API_TOKEN to repository Secrets.'; exit 1; }
          test -n "$SERVER_RUNTIME_SECRETS" || { echo '::error::Add the prepared SERVER_RUNTIME_SECRETS JSON to repository Secrets.'; exit 1; }
      - name: Install deployment CLI
        run: npm install --no-audit --no-fund
        working-directory: server
      - name: Prepare database binding and first-deployment seed
        run: |
          node scripts/configure-cloudflare.mjs
          npm run seed:build
        working-directory: server
      - name: Apply schema and initialize at least 1000 unique messages once
        run: npx wrangler d1 migrations apply delneveshte-sms --remote --config .local/wrangler.json
        working-directory: server
      - name: Deploy backend and admin panel
        run: |
          npx wrangler deploy --config .local/wrangler.json
          npx wrangler secret bulk .local/runtime-secrets.json --config .local/wrangler.json
        working-directory: server
      - name: Verify live service and configure the mobile endpoint
        run: python3 scripts/configure-mobile-endpoint.py
      - uses: actions/upload-artifact@v4
        with:
          name: server-addresses
          path: server/.local/deployment.json
