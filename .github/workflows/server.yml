name: Server and Docker checks

on:
  push:
    branches: [main]
    paths: ['server/**', 'Dockerfile', '.dockerignore', 'compose.yaml', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', 'Dockerfile', '.dockerignore', 'compose.yaml', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: server
      - name: Verify chart rendering, navigation and text safety in a DOM
        run: |
          npm install --prefix "$RUNNER_TEMP/chart-check" --no-audit --no-fund jsdom@26.1.0
          CHART_TEST_MODULES="$RUNNER_TEMP/chart-check/node_modules" node server/scripts/check-admin-charts.mjs
      - name: Build production Docker image
        run: docker build -t delneveshte-test .
      - name: Verify HTTP API, admin login and persistence across replacement containers
        run: python3 server/scripts/docker-smoke.py delneveshte-test
